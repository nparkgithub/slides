ine);background:transparent;color:var(--ink);cursor:pointer;font-size:10px}.route-buttons button:hover{border-color:var(--accent);background:var(--soft);color:var(--accent)}.route-help{margin:9px 0 0!important;font-size:10px!important;font-weight:400!important;letter-spacing:0!important;text-transform:none!important}

    const transportPlans={
      tokyo:{airport:'Narita International Airport',code:'NRT',flightLeg:'San Diego (SAN) → Tokyo (NRT)',flightNote:'Use your airline itinerary for the flight number, terminal, and arrival time. Narita’s live board is the final check on travel day.',terminalNote:'International arrival: clear immigration and customs, then follow signs to the rail stations or airport bus counters.',airportHref:'https://www.narita-airport.jp/en/flight/',options:[['train','Narita Express (N’EX)','Narita Airport → Tokyo / Shimbashi → Shiodome','≈ 70 km','≈ 70–90 min','Reserved-seat JR service; allow time for the short city transfer to the hotel.','https://www.jreast.co.jp/multi/en/nex/','JR East N’EX'],['train','Keisei Skyliner','Narita Airport → Nippori / Ueno → Shiodome','≈ 70 km','≈ 65–85 min','Fast reserved-seat option to central Tokyo, then continue by JR or taxi.','https://www.keisei.co.jp/keisei/tetudou/skyliner/us/skyliner/','Keisei Skyliner'],['bus','Airport limousine bus','Narita Airport → Tokyo hotel area / Shiodome','≈ 70 km','≈ 90–120 min','Comfortable with luggage; traffic makes the arrival time variable.','https://www.narita-airport.jp/en/access/bus/','Narita bus access'],['taxi','Taxi / pre-booked car','Narita Airport → Tokyo hotel','≈ 70 km','≈ 70–100 min','Door-to-door, but traffic and late-night surcharges can materially change the fare.','https://www.narita-airport.jp/en/access/taxi/','Narita taxi guidance']],links:[['Narita arrivals & terminals','https://www.narita-airport.jp/en/flight/'],['Narita access overview','https://www.narita-airport.jp/en/access/'],['Hotel official site','https://www.royalparkhotels.co.jp/en/ic/tokyoshiodome/']]},
      kyoto:{airport:'Kansai International Airport',code:'KIX',flightLeg:'KIX → Kyoto Station → Shijokarasuma',flightNote:'Kyoto has no commercial international airport; KIX is the practical international gateway for this chapter.',terminalNote:'After immigration and customs, follow signs to Kansai-Airport Station. Kyoto Station is the simplest rail anchor for the hotel.',airportHref:'https://www.kansai-airport.or.jp/en/flight/search',options:[['train','JR Limited Express HARUKA','Kansai Airport → Kyoto Station → Shijokarasuma','≈ 100 km','≈ 90–110 min','The cleanest airport-to-Kyoto rail connection; finish with subway, taxi, or a short walk.','https://www.westjr.co.jp/global/en/ticket/cp/umekitacp/','JR-West HARUKA'],['bus','Airport limousine bus','KIX → Kyoto Station Hachijo-guchi → hotel','≈ 100 km','≈ 105–135 min','Useful with large luggage; road traffic makes the last-mile timing variable.','https://www.kansai-airport.or.jp/en/access/from-airport','KIX access'],['taxi','Taxi / pre-booked car','KIX → Hotel Intergate Kyoto Shijokarasuma','≈ 100 km','≈ 100–140 min','Door-to-door convenience with a high, variable fare; reserve only after checking luggage and arrival time.','https://www.kansai-airport.or.jp/en/access/from-airport','KIX access guidance'],['walk','Last mile from Karasuma','Karasuma Station → Hotel Intergate Kyoto Shijokarasuma','≈ 0.4 km','≈ 5–8 min','A short final walk after arriving in central Kyoto; exact exit matters with luggage.','https://www.google.com/maps/search/?api=1&query=Hotel%20Intergate%20Kyoto%20Shijokarasuma','Open hotel in Maps']],links:[['KIX flights','https://www.kansai-airport.or.jp/en/flight/search'],['KIX access overview','https://www.kansai-airport.or.jp/en/access/from-airport'],['Hotel official site','https://www.intergatehotels.jp/']]},

    let landing=true,city='tokyo',filter='all',selected='hotel',showAll=false,today=false,night=false,planned=[];
    const $=s=>document.querySelector(s);
    const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    function placeKind(x){const name=x[0].toLowerCase(),cat=x[1].toLowerCase();if(name.includes('donguri')||name.includes('ghibli'))return 'shopping';if(name.includes('station'))return 'transit';if(cat==='cafe'||name.includes('cafe'))return 'cafe';if(cat==='breakfast')return 'bakery';if(cat==='sushi')return 'sushi';if(cat==='wagyu')return 'meat';if(cat==='nightlife'||cat==='club')return 'nightlife';return 'food'}
    function iconFor(x){return {food:'🍜',cafe:'☕',bakery:'🥐',sushi:'🍣',meat:'🥩',nightlife:'🍷',shopping:'🛍️',transit:'🚉'}[placeKind(x)]}
    Object.values(cities).forEach(c=>c.places.forEach(place=>{place[3]=iconFor(place)}));
    function data(){const c=cities[city];let p=c.places.filter(x=>filter==='all'||filter==='danielle'&&x[6]==='danielle'||filter==='fav'&&x[6]==='fav'||filter.toLowerCase()===x[1].toLowerCase()||filter==='Nightlife'&&(x[1]==='Nightlife'||x[1]==='Club'));return {c,p}}
    function render(){if(landing){document.documentElement.style.setProperty('--accent','#bb2c25');document.documentElement.style.setProperty('--soft','#f2dfd9');$('#app').className='app landing';$('#app').innerHTML=`<header class="landing-top"><div class="brand"><span class="brand-mark">日</span><div><strong>JOURNEY / 01</strong><small>Japan trip companion</small></div></div><small>Source map · Tokyo / Kyoto / Osaka</small></header><main class="landing-shell"><section class="landing-copy"><span class="eyebrow">The original trip map</span><h1>A visual index for the journey.</h1><p>Start with the map that shaped the trip, then move into the interactive companion for neighborhoods, hotels, saved places, and routes.</p><button onclick="landing=false;render()">Open interactive trip map ↗</button><div class="landing-meta"><span>3 cities</span><span>Hotels + places</span><span>October 2026</span></div></section><figure class="landing-frame"><img src="info_map.png" alt="Tokyo, Kyoto, and Osaka travel map reference" /></figure></main><div class="landing-caption">Reference map · supplied trip structure · interactive layer follows</div>`;return}const {c,p}=data();document.documentElement.style.setProperty('--accent',c.accent);document.documentElement.style.setProperty('--soft',c.soft);$('#app').className='app'+(night?' night':'');$('#app').innerHTML=`<header class="top"><div class="brand"><span class="brand-mark">日</span><div><strong>JOURNEY / 01</strong><small>Japan trip companion</small></div></div><div class="top-context"><span>Next chapter</span><strong>${c.name}</strong><span>/</span><span>${c.region}</span></div><div class="top-actions"><button class="${today?'active':''}" onclick="toggleToday()">◫ ${today?'Explore map':'Today'}</button><button onclick="toggleNight()">${night?'◉ Day':'◐ Night'}</button></div></header><section class="intro"><div><div class="index">01 <span>Trip map</span></div><h1>${c.kicker}</h1><p>${c.desc}</p></div><div class="base"><span class="eyebrow">Base</span><strong>${c.hotel.neighborhood}</strong><small>Hotel anchored · ${c.name}</small></div></section><nav class="tabs"><span>Your route</span><div class="tablist">${Object.entries(cities).map(([id,v],i)=>`<button class="tab ${id===city?'active':''}" style="--tab:${v.accent}" onclick="changeCity('${id}')"><small>0${i+1}</small>${v.name}</button>`).join('')}</div></nav><main class="experience"><section><div class="map-panel"><div class="map-top"><span>⌖ Geographic map · to scale</span><div class="map-controls"><button>+</button><button>−</button><button>N</button></div></div><div class="map-canvas"><div class="transit"><i></i><i></i><i></i></div>${c.labels.map(l=>`<span class="label ${l[3]?'active':''}" style="left:${l[1]}%;top:${l[2]}%">${l[0]}</span>`).join('')}${(showAll?p:p.filter(x=>x[6])).map(x=>`<button class="marker ${x[6]||''} ${selected===slug(x[0])?'selected':''}" style="left:${x[4]}%;top:${x[5]}%" onclick="selectPlace('${slug(x[0])}')">${x[3]}</button>`).join('')}<button class="hotel" style="left:${c.hotel.x}%;top:${c.hotel.y}%" onclick="selectHotel()"><span class="hotel-bubble">⌂</span><span class="hotel-label"><small>Your hotel</small>${c.hotel.neighborhood}</span></button><span class="scale">— — — &nbsp; 1 km</span><span class="note">Selected places are highlighted · <button onclick="toggleAll()">${showAll?'Show curated view':'Show all places'}</button></span></div><div class="legend"><span><i class="dot hotel-dot"></i>Hotel</span><span><i class="dot place-dot"></i>Saved place</span><span><i class="dot danielle-dot"></i>Danielle’s pick</span><span>★ Especially recommended</span></div></div><div class="map-bottom"><span>⌾ ${p.length} places in view</span><button onclick="openTransport()">▣ Transport notes ↗</button></div></section><aside class="rail"><div class="rail-top"><div><span class="eyebrow">${today?'Daily edit':'Stay close'}</span><h2>${today?'Today’s outline':'Make the map useful'}</h2></div><button class="round">⌕</button></div><div class="filters"><strong>Filter</strong><div class="chips">${filterList.map(f=>`<button class="chip ${filter===f[0]?'active':''}" onclick="setFilter('${f[0]}')">${f[1]}</button>`).join('')}</div></div>${today?todayPanel(c,p):hotelAndPlaces(c,p)}</aside></main><footer class="footer"><span>旅 &nbsp; Tokyo · Kyoto · Osaka</span><span class="footer-center">A small, considered map for a big trip.</span><span>● Live plan</span></footer>${document.querySelector('.drawer')?.outerHTML||''}`}
    function mobilePlaceSheet(c){const x=c.places.find(y=>slug(y[0])===selected);if(!x)return '';const kind=placeKind(x);return `<article class="mobile-place-sheet" aria-live="polite"><span class="mobile-place-sheet-icon ${kind}">${iconFor(x)}</span><div class="mobile-place-sheet-copy"><span>${x[1]} · ${x[2]}</span><strong>${x[0]}</strong><button onclick="openMobileDetails()">View full details ↗</button></div><button class="mobile-place-sheet-close" onclick="selectHotel()" aria-label="Close ${x[0]}">×</button></article>`}
    function openMobileDetails(){document.querySelector('.rail')?.scrollIntoView({behavior:'smooth',block:'start'})}
    function hotelAndPlaces(c,p){const place=c.places.find(x=>slug(x[0])===selected);return `<article class="hotel-card"><div class="card-kicker"><b>⌂</b><span>Your hotel</span><i></i></div>${c.hotel.image?`<img class="hotel-image" src="${c.hotel.image}" alt="${c.hotel.name} lounge atmosphere">`:''}<div class="hotel-body"><div class="hotel-heading"><div><span class="eyebrow">Basecamp · ${c.hotel.neighborhood}</span><h2>${c.hotel.name}</h2></div><span class="hotel-number">01</span></div><div class="hotel-note">${c.hotel.note}</div><div class="hotel-meta">⌖ ${c.hotel.station}<br>⌖ ${c.hotel.address}</div><div style="display:flex;gap:14px;flex-wrap:wrap"><button class="action" onclick="maps('${c.hotel.name}')">Open hotel in Maps ↗</button>${c.hotel.website?`<a class="action" href="${c.hotel.website}" target="_blank" rel="noreferrer">Official hotel site ↗</a>`:''}</div></div></article>${place?detail(place,c):`<div class="detail-note">Select a place on the map to see its travel details.</div>`}<div class="list-head"><div><span class="eyebrow">Saved places</span><strong>${p.length} to explore</strong></div><small>Closest to hotel⌄</small></div><div class="list">${p.map(x=>`<div class="row ${selected===slug(x[0])?'selected':''}"><button class="row-main" onclick="selectPlace('${slug(x[0])}')"><span class="avatar kind-${placeKind(x)}">${iconFor(x)}</span><span class="row-copy"><strong>${x[0]}</strong><small>${x[1]} · ${x[2]} ${x[6]?'· '+(x[6]==='fav'?'★ Favorite':'Danielle’s pick'):''}</small></span></button><button class="add" onclick="plan('${slug(x[0])}')">${planned.includes(slug(x[0]))?'✓':'+'}</button></div>`).join('')}</div><button class="transport" onclick="openTransport()">▣ <span>Airport + transit notes</span><span>↗</span></button>`}

<script>
(function(){
  const baseMapsWithContext = maps;
  maps = function(q){
    const c = cities[city] || {};
    const cityName = (c.name || city || '').replace(/ \(.+\)$/, '');

    const contextualQuery = q.includes(cityName) && q.includes(country) ? q : q + ', ' + cityName + ', ' + country;
    baseMapsWithContext(contextualQuery);
  };
  openDirections = function(placeName, mode, transitMode){
    const c = cities[city] || {};
    const cityName = (c.name || city || '').replace(/ \(.+\)$/, '');
    const country = (city === 'busan' || city === 'seoul') ? 'South Korea' : 'Japan';
    const params = new URLSearchParams({api:'1', origin:(c.hotel.name + ', ' + c.hotel.address), destination:(placeName + ', ' + cityName + ', ' + country), travelmode:mode});
    if(transitMode) params.set('transit_mode', transitMode);
    const url = 'https://www.google.com/maps/dir/?' + params.toString();
    const tab = window.open(url, '_blank');
    if(!tab) window.location.href = url;
  };
})();
