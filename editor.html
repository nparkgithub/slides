            }

            function updateReloadAvailability() {
                reloadFileButton.disabled = !(currentFileHandle || sourceUrlInput.value.trim());
            }

            function captureReloadState() {
                captureEditorViewState();
                const currentSlide = slideElements[currentSlideIndex];
                const viewState = currentSlide ? editorViewState.get(currentSlide) : null;
                return {
                    currentSlideIndex,
                    contentEditorVisible,
                    notesEditorVisible,
                    slideOverviewVisible,
                    editorPanelRatio,
                    assetBaseUrl: assetBaseUrlInput.value,
                    sourceUrl: sourceUrlInput.value,
                    localAssetDirectoryHandle,
                    viewState: viewState ? { ...viewState } : null,
                };
            }

            function directNotesElement(slide) {
                return Array.from(slide.children).find((child) => child.matches('aside.notes')) || null;
            }

            function captureEditorViewState() {
                const slide = slideElements[currentSlideIndex];
                if (!slide) return;

                editorViewState.set(slide, {
                    activeEditor: document.activeElement === contentEditor ? 'content' : document.activeElement === notesEditor ? 'notes' : null,
                    contentSelectionStart: contentEditor.selectionStart,
                    contentSelectionEnd: contentEditor.selectionEnd,
                    contentScrollTop: contentEditor.scrollTop,
                    contentScrollLeft: contentEditor.scrollLeft,
                    notesSelectionStart: notesEditor.selectionStart,
                    notesSelectionEnd: notesEditor.selectionEnd,
                    notesScrollTop: notesEditor.scrollTop,
                    notesScrollLeft: notesEditor.scrollLeft,
                });
            }

            function restoreEditorViewState(slide) {
                const saved = editorViewState.get(slide);
                if (!saved) return;

                const restore = () => {
                    const contentStart = Math.min(saved.contentSelectionStart ?? 0, contentEditor.value.length);
                    const contentEnd = Math.min(saved.contentSelectionEnd ?? contentStart, contentEditor.value.length);
                    const notesStart = Math.min(saved.notesSelectionStart ?? 0, notesEditor.value.length);
                    const notesEnd = Math.min(saved.notesSelectionEnd ?? notesStart, notesEditor.value.length);
                    contentEditor.setSelectionRange(contentStart, contentEnd);
                    notesEditor.setSelectionRange(notesStart, notesEnd);
                    contentEditor.scrollTop = saved.contentScrollTop ?? 0;
                    contentEditor.scrollLeft = saved.contentScrollLeft ?? 0;
                    notesEditor.scrollTop = saved.notesScrollTop ?? 0;
                    notesEditor.scrollLeft = saved.notesScrollLeft ?? 0;
                    if (saved.activeEditor === 'content') contentEditor.focus({ preventScroll: true });
                    if (saved.activeEditor === 'notes') notesEditor.focus({ preventScroll: true });
                };

                window.requestAnimationFrame(restore);
            }

            function previewBaseUrl() {
                const configuredBase = assetBaseUrlInput.value.trim();
                try {
                    return new URL(configuredBase || document.baseURI, document.baseURI).href;
                } catch (error) {
                    setPreviewStatus('Invalid asset base URL', 'warning');
                    return document.baseURI;
                }
            }

            function localAssetKey(rawUrl) {
                if (!rawUrl || /^(?:[a-z][a-z\d+.-]*:|\/\/|\/|#)/i.test(rawUrl.trim())) return null;
                try {
                    const parsed = new URL(rawUrl, 'https://local-asset.invalid/');
                    return decodeURIComponent(parsed.pathname).replace(/^\/+/, '');
                } catch (error) {
                    return null;
                }
            }

            function localAssetObjectUrl(rawUrl) {
                const key = localAssetKey(rawUrl);
                return key ? localAssetObjectUrls.get(key) || null : null;
            }

            function replaceLocalAssetReferences(value) {
                return value.replace(/url\(\s*(['"]?)([^)'"\s]+)\1\s*\)/gi, (match, quote, rawUrl) => {
                    const objectUrl = localAssetObjectUrl(rawUrl);
                    return objectUrl ? `url(${quote}${objectUrl}${quote})` : match;
                });
            }

            function rewriteLocalAssetReferences(root) {
                if (!localAssetDirectoryHandle || localAssetObjectUrls.size === 0) return;

                root.querySelectorAll('[src], [poster]').forEach((element) => {
                    ['src', 'poster'].forEach((attribute) => {
                        const rawUrl = element.getAttribute(attribute);
                        const objectUrl = localAssetObjectUrl(rawUrl);
                        if (objectUrl) element.setAttribute(attribute, objectUrl);
                    });
                });
                root.querySelectorAll('[style]').forEach((element) => {
                    element.setAttribute('style', replaceLocalAssetReferences(element.getAttribute('style')));
                });
                root.querySelectorAll('style').forEach((style) => {
                    style.textContent = replaceLocalAssetReferences(style.textContent);
                });
            }

            async function readLocalAssetFile(relativePath) {
                if (!localAssetDirectoryHandle || !relativePath) return null;
                const parts = relativePath.split('/').filter(Boolean);
                const candidates = [parts];
                // Accept either the deck folder (deck.html + assets/) or the
                // assets folder itself. This avoids the common assets/assets/
                // mismatch when the user selects the folder named "assets".
                if (parts[0] === localAssetDirectoryHandle.name) candidates.push(parts.slice(1));

                for (const candidate of candidates) {
                    let directory = localAssetDirectoryHandle;
                    try {
                        for (const part of candidate.slice(0, -1)) {
                            if (part === '..') throw new Error('Asset path escapes selected folder');
                            directory = await directory.getDirectoryHandle(part);
                        }
                        if (candidate.length && candidate.at(-1) !== '..') {
                            return await directory.getFileHandle(candidate.at(-1));
                        }
                    } catch (error) {
                        // Try the next candidate path, if one exists.
                    }
                }
                return null;
            }

            function fileAsDataUrl(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(reader.error || new Error('Could not read local asset'));
                    reader.readAsDataURL(file);
                });
            }

            async function loadLocalAssetFiles() {
                if (!localAssetDirectoryHandle) return;

                const rawUrls = new Set();
                const collectCssUrls = (value) => {
                    for (const match of value.matchAll(/url\(\s*(['"]?)([^)'"\s]+)\1\s*\)/gi)) {
                        if (localAssetKey(match[2])) rawUrls.add(match[2]);
                    }
                };
                slideElements.forEach((slide) => {
                    slide.querySelectorAll('[src], [poster]').forEach((element) => {
                        ['src', 'poster'].forEach((attribute) => {
                            const rawUrl = element.getAttribute(attribute);
                            if (localAssetKey(rawUrl)) rawUrls.add(rawUrl);
                        });
                    });
                    slide.querySelectorAll('[style], style').forEach((element) => {
                        collectCssUrls(element.getAttribute('style') || element.textContent || '');
                    });
                });
                presentationDoc.head.querySelectorAll('style').forEach((style) => collectCssUrls(style.textContent));

                for (const rawUrl of rawUrls) {
                    const key = localAssetKey(rawUrl);
                    if (!key || localAssetObjectUrls.has(key)) continue;
                    const fileHandle = await readLocalAssetFile(key);
                    if (!fileHandle) continue;
                    const file = await fileHandle.getFile();
                    // Data URLs work inside the sandboxed srcdoc iframe even
                    // when blob URLs are blocked by the browser's origin rules.
                    localAssetObjectUrls.set(key, await fileAsDataUrl(file));
                }
            }

            function clearLocalAssetState() {
                localAssetObjectUrls.clear();
                localAssetDirectoryHandle = null;
            }

            const escapeAttribute = (value) => String(value)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            const escapeHTML = (value) => value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            function setSpellcheck(enabled) {
                spellcheckEnabled = enabled;
                contentEditor.spellcheck = enabled;
                notesEditor.spellcheck = enabled;
                spellcheckButton.textContent = `Spell: ${enabled ? 'On' : 'Off'}`;
            }

            function visibleHtmlText(html) {
                const documentFragment = new DOMParser().parseFromString(html, 'text/html');
                documentFragment.querySelectorAll('script, style, aside.notes').forEach((element) => element.remove());
                return documentFragment.body.textContent.replace(/\s+/g, ' ').trim();
            }

            function renderWritingResults(issues) {
                writingResultsList.innerHTML = issues.length
                    ? issues.map(({ area, match }) => {
                        const suggestion = match.replacements[0]?.value;
                        return `<div class="writing-issue"><strong>${escapeHTML(area)}</strong>: ${escapeHTML(match.message)}<br><code>${escapeHTML(match.context?.text || '')}</code>${suggestion ? `<br>Suggestion: <strong>${escapeHTML(suggestion)}</strong>` : ''}</div>`;
                    }).join('')
                    : '<p>No spelling or grammar suggestions found for this slide.</p>';
                writingResults.style.display = 'block';
            }

            function startWritingResultsDrag(event) {
                if (event.target.closest('button')) return;
                const dialogBounds = writingResults.getBoundingClientRect();
                const offsetX = event.clientX - dialogBounds.left;
                const offsetY = event.clientY - dialogBounds.top;
                writingResults.style.left = `${dialogBounds.left}px`;
                writingResults.style.top = `${dialogBounds.top}px`;
                writingResults.style.right = 'auto';
                event.preventDefault();

                const drag = (moveEvent) => {
                    const maxLeft = Math.max(8, window.innerWidth - dialogBounds.width - 8);
                    const maxTop = Math.max(8, window.innerHeight - dialogBounds.height - 8);
                    writingResults.style.left = `${Math.min(Math.max(8, moveEvent.clientX - offsetX), maxLeft)}px`;
                    writingResults.style.top = `${Math.min(Math.max(8, moveEvent.clientY - offsetY), maxTop)}px`;
                };
                const stopDragging = () => {
                    document.removeEventListener('pointermove', drag);
                    document.removeEventListener('pointerup', stopDragging);
                };
                document.addEventListener('pointermove', drag);
                document.addEventListener('pointerup', stopDragging, { once: true });
            }

            async function checkGrammar() {
                if (!presentationDoc) return;
                const sources = [
                    { area: 'Slide content', text: visibleHtmlText(contentEditor.value) },
                    { area: 'Speaker notes', text: notesEditor.value.trim() },
                ].filter(({ text }) => text);

                grammarButton.disabled = true;
                grammarStatus.textContent = 'Checking with LanguageTool…';
                try {
                    const results = await Promise.all(sources.map(async ({ area, text }) => {
                        const response = await fetch('https://api.languagetool.org/v2/check', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: new URLSearchParams({ text, language: 'auto' }),
                        });
                        if (!response.ok) throw new Error(`LanguageTool returned ${response.status}`);
                        const data = await response.json();
                        return data.matches.map((match) => ({ area, match }));
                    }));
                    const issues = results.flat();
                    renderWritingResults(issues);
                    grammarStatus.textContent = `${issues.length} suggestion${issues.length === 1 ? '' : 's'}`;
                } catch (error) {
                    writingResultsList.textContent = 'Grammar checking is unavailable. Check your internet connection and try again.';
                    writingResults.style.display = 'block';
                    grammarStatus.textContent = 'Grammar check unavailable';
                    console.error('Grammar check failed:', error);
                } finally {
                    grammarButton.disabled = false;
                }
            }

            window.addEventListener('message', (event) => {
                if (event.data?.type !== 'fragment-state') return;
                if (event.source !== previewFrame.contentWindow) return;
                const currentSlide = slideElements[currentSlideIndex];
                if (currentSlide && Number.isInteger(event.data.fragmentIndex)) {
                    fragmentState.set(currentSlide, event.data.fragmentIndex);
                }
                previewPrevFragmentBtn.disabled = !event.data.canPrevious;
                previewNextFragmentBtn.disabled = !event.data.canNext;
                if (event.data.missingAssets?.length) {
                    setPreviewStatus('Missing preview assets; check Asset base URL', 'warning');
                } else {
                    setPreviewStatus(event.data.overflow ? 'Preview content may overflow' : 'Preview ready', event.data.overflow ? 'warning' : '');
                }
            });

            window.addEventListener('message', (event) => {
                if (event.source !== previewFrame.contentWindow) return;
                if (event.data?.type === 'preview-element-selected') {
                    if (!previewEditingEnabled) return;
                    if (!contentEditorVisible) {
                        contentEditorVisible = true;
                        updateEditorVisibility();
                    }
                    selectHtmlElementInEditor(event.data.nodeIndex);
                }
                if (event.data?.type === 'preview-content-input') {
                    if (!previewEditingEnabled) return;
                    applyPreviewContentEdit(event.data.nodeIndex, event.data.innerHTML || '');
                }
            });

            const state = {
                enable: () => {
                    saveBtn.disabled = false;
                    saveAsBtn.disabled = false;
                    refreshPreviewButton.disabled = false;
                    togglePreviewEditingButton.disabled = false;
                    updateReloadAvailability();
                    grammarButton.disabled = false;
                    contentEditor.disabled = false;
                    notesEditor.disabled = false;
                    previewPrevPageBtn.disabled = false;
                    previewNextPageBtn.disabled = false;
                    previewPrevFragmentBtn.disabled = false;
                    previewNextFragmentBtn.disabled = false;
                    navControls.style.display = 'block';
                    grammarStatus.textContent = 'Grammar checks send text to LanguageTool.';
                    setPreviewStatus('Preview ready');
                },
                disable: () => {
                    saveBtn.disabled = true;
                    saveAsBtn.disabled = true;
                    refreshPreviewButton.disabled = true;
                    togglePreviewEditingButton.disabled = true;
                    reloadFileButton.disabled = true;
                    grammarButton.disabled = true;
                    contentEditor.disabled = true;
                    notesEditor.disabled = true;
                    navControls.style.display = 'none';
                    contentEditor.value = '';
                    contentBackdrop.textContent = '';
                    notesEditor.value = '';
                    slideNavDisplay.textContent = 'Slide 0 / 0';
                    previewPrevPageBtn.disabled = true;
                    previewNextPageBtn.disabled = true;
                    previewPrevFragmentBtn.disabled = true;
                    previewNextFragmentBtn.disabled = true;
                    grammarStatus.textContent = '';
                    setPreviewStatus('');
                    clearTimeout(slideOverviewRenderTimer);
                    slideOverviewList.replaceChildren();
                    lastDeletedSlide = null;
                    undoDeleteSlideButton.disabled = true;
                    setDirty(false);
                }
            };

            const loadFile = (file, { localFile = false, reloadState = null, reloaded = false } = {}) => {
                if (!file) return;

                const preservedAssetDirectoryHandle = reloadState?.localAssetDirectoryHandle || null;
                clearLocalAssetState();
                chooseAssetFolderButton.disabled = !localFile || !('showDirectoryPicker' in window);
                if (localFile) {
                    assetBaseUrlInput.value = '';
                    sourceUrlInput.value = '';
                }
                originalFileName = file.name;
                fileNameDisplay.textContent = originalFileName;
                const reader = new FileReader();

                reader.onload = async (e) => {
                    const content = e.target.result;
                    const parser = new DOMParser();
                    presentationDoc = parser.parseFromString(content, 'text/html');
                    previewGeneration += 1;
                    clearTimeout(previewUpdateTimer);
                    previewUpdateTimer = null;
                    // Reveal supports vertical slides as direct child sections of a
                    // horizontal section. Flatten them so each slide can be edited
                    // and navigated independently.
                    slideElements = Array.from(presentationDoc.querySelectorAll('.slides > section'))
                        .flatMap(horizontalSlide => {
                            const verticalSlides = Array.from(horizontalSlide.children)
                                .filter(child => child.matches('section'));
                            return verticalSlides.length ? verticalSlides : [horizontalSlide];
                        });

                    // Find all reveal.js related scripts to inject into the preview
                    const scriptTags = Array.from(presentationDoc.querySelectorAll('script[src*="reveal.js"], script[src*="plugin"]'));
                    scriptHTML = scriptTags.map(s => s.outerHTML).join('\n');

                    if (slideElements.length > 0) {
                        if (reloadState) {
                            contentEditorVisible = reloadState.contentEditorVisible;
                            notesEditorVisible = reloadState.notesEditorVisible;
                            slideOverviewVisible = reloadState.slideOverviewVisible;
                            setEditorPanelRatio(reloadState.editorPanelRatio, { persist: false });
                            assetBaseUrlInput.value = reloadState.assetBaseUrl;
                            sourceUrlInput.value = reloadState.sourceUrl;
                        }

                        currentSlideIndex = reloadState
                            ? Math.min(reloadState.currentSlideIndex, slideElements.length - 1)
                            : 0;
                        lastDeletedSlide = null;
                        setDirty(false);
                        state.enable();
                        updateEditorVisibility();
                        updateSlideOverviewVisibility();
                        renderSlide(currentSlideIndex);
                        if (reloadState?.viewState) {
                            editorViewState.set(slideElements[currentSlideIndex], reloadState.viewState);
                            restoreEditorViewState(slideElements[currentSlideIndex]);
                        }
                        renderSlideOverview();

                        if (preservedAssetDirectoryHandle) {
                            localAssetDirectoryHandle = preservedAssetDirectoryHandle;
                            setPreviewStatus('Reloading local assets…');
                            try {
                                await loadLocalAssetFiles();
                                refreshCurrentPreview();
                                renderSlideOverview();
                                setPreviewStatus('Reloaded from disk');
                            } catch (error) {
                                setPreviewStatus(`Reloaded, but local assets could not be refreshed: ${error.message}`, 'warning');
                                console.error('Error reloading local assets:', error);
                            }
                        } else if (reloaded) {
                            setPreviewStatus('Reloaded from disk');
                        }
                    } else {
                        alert('Could not find any slides (<section> tags) in this file.');
                        state.disable();
                    }
                };

                reader.readAsText(file);
            };

            async function loadFromUrl(rawUrl, { reloadState = null, reloaded = false } = {}) {
                const resolvedUrl = new URL(rawUrl, document.baseURI);
                const response = await fetch(resolvedUrl.href);
                if (!response.ok) throw new Error(`Could not load deck (${response.status})`);
                const blob = await response.blob();
                const fileName = decodeURIComponent(resolvedUrl.pathname.split('/').pop() || 'presentation.html');
                assetBaseUrlInput.value = new URL('.', resolvedUrl).href;
                sourceUrlInput.value = resolvedUrl.href;
                currentFileHandle = null;
                updateReloadAvailability();
                loadFile(new File([blob], fileName, { type: 'text/html' }), { reloadState, reloaded });
            }

            async function reloadCurrentFile() {
                if (!presentationDoc) return;
                if (isDirty && !window.confirm('Reload the file and discard unsaved changes?')) return;

                const reloadState = captureReloadState();
                reloadFileButton.disabled = true;
                setPreviewStatus('Reloading…');

                try {
                    if (currentFileHandle) {
                        const file = await currentFileHandle.getFile();
                        loadFile(file, { localFile: true, reloadState, reloaded: true });
                    } else if (sourceUrlInput.value.trim()) {
                        await loadFromUrl(sourceUrlInput.value.trim(), { reloadState, reloaded: true });
                    } else {
                        setPreviewStatus('Reopen the file to reload it.', 'warning');
                        updateReloadAvailability();
                    }
                } catch (error) {
                    updateReloadAvailability();
                    setPreviewStatus(`Reload failed: ${error.message}`, 'error');
                    console.error('Error reloading deck:', error);
                }
            }

            loadUrlButton.addEventListener('click', async () => {
                if (!sourceUrlInput.value.trim()) return;
                try {
                    await loadFromUrl(sourceUrlInput.value.trim());
                } catch (error) {
                    setPreviewStatus(`Load failed: ${error.message}`, 'error');
                    console.error('Error loading deck URL:', error);
                }
            });

            reloadFileButton.addEventListener('click', reloadCurrentFile);

            const initialFileUrl = new URLSearchParams(window.location.search).get('file');
            if (initialFileUrl) {
                loadFromUrl(initialFileUrl).catch((error) => {
                    setPreviewStatus(`Load failed: ${error.message}`, 'error');
                    console.error('Error loading initial deck URL:', error);
                });
            }

            loadButton.addEventListener('click', async () => {
                if ('showOpenFilePicker' in window) {
                    try {
                        const [handle] = await window.showOpenFilePicker({
                            id: 'reveal-editor-open-html',
                            types: [{ description: 'HTML Files', accept: { 'text/html': ['.html'] } }],
                        });
                        currentFileHandle = handle;
                        const file = await handle.getFile();
                        loadFile(file, { localFile: true });
                    } catch (err) {
                        if (err.name !== 'AbortError') console.error('Error opening file:', err);
                    }
                } else {
                    // Fallback for browsers without the API
                    fileInput.click();
                }
            });

            fileInput.addEventListener('change', (event) => {
                currentFileHandle = null;
                loadFile(event.target.files[0], { localFile: true });
            });

            chooseAssetFolderButton.addEventListener('click', async () => {
                if (!presentationDoc || !('showDirectoryPicker' in window)) return;
                try {
                    const directoryPickerOptions = {
                        id: 'reveal-editor-assets',
                        mode: 'read',
                    };
                    // When the HTML was opened with the File System Access
                    // picker, start beside that file so the deck's assets
                    // folder is immediately available to select.
                    if (currentFileHandle) directoryPickerOptions.startIn = currentFileHandle;
                    localAssetDirectoryHandle = await window.showDirectoryPicker(directoryPickerOptions);
                    localAssetObjectUrls.clear();
                    setPreviewStatus('Loading local assets…');
                    await loadLocalAssetFiles();
                    refreshCurrentPreview();
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        setPreviewStatus(`Could not load local assets: ${error.message}`, 'warning');
                        console.error('Error loading local assets:', error);
                    }
                }
            });

            toggleEditorsButton.addEventListener('click', toggleEditors);
            toggleContentEditorButton.addEventListener('click', () => {
                contentEditorVisible = !contentEditorVisible;
                updateEditorVisibility();
            });
            toggleNotesEditorButton.addEventListener('click', () => {
                notesEditorVisible = !notesEditorVisible;
                updateEditorVisibility();
            });
            toggleSlideOverviewButton.addEventListener('click', () => {
                slideOverviewVisible = !slideOverviewVisible;
                updateSlideOverviewVisibility();
            });
            hideSlideOverviewButton.addEventListener('click', () => {
                slideOverviewVisible = false;
                updateSlideOverviewVisibility();
            });
            togglePreviewEditingButton.addEventListener('click', () => {
                setPreviewEditingEnabled(!previewEditingEnabled);
            });
            undoDeleteSlideButton.addEventListener('click', undoDeleteSlide);
            updatePreviewEditingButton();
            updateEditorVisibility();
            updateSlideOverviewVisibility();

            function buildPreviewDoc(currentSlide, initialFragmentIndex = -1) {
                // Scripts already present in <head> would otherwise run twice: once
                // from the copied head and once from scriptHTML below.
                const previewHead = presentationDoc.head.cloneNode(true);
                previewHead.querySelectorAll('script').forEach(script => script.remove());
                previewHead.querySelectorAll('base').forEach(base => base.remove());
                const baseElement = presentationDoc.createElement('base');
                baseElement.href = previewBaseUrl();
                previewHead.prepend(baseElement);
                const previewSlide = currentSlide.cloneNode(true);
                rewriteLocalAssetReferences(previewHead);
                rewriteLocalAssetReferences(previewSlide);
                if (previewEditingEnabled) {
                    previewSlide.setAttribute('contenteditable', 'true');
                    previewSlide.setAttribute('spellcheck', 'false');
                    previewSlide.querySelectorAll('*').forEach((element, index) => {
                        element.dataset.editorNode = index;
                        if (!element.closest('aside.notes')) element.setAttribute('contenteditable', 'true');
                    });
                } else {
                    previewSlide.removeAttribute('contenteditable');
                    previewSlide.removeAttribute('spellcheck');
                    previewSlide.querySelectorAll('[contenteditable], [data-editor-node]').forEach((element) => {
                        element.removeAttribute('contenteditable');
                        element.removeAttribute('data-editor-node');
                    });
                }

                return `<html style="background-color: #000;">
                    <head>${previewHead.innerHTML}</head>
                    <body>
                        <style>
                            html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
                            .reveal { width: 100%; height: 100%; }
                            .reveal .slides { width: 100%; height: 100%; }
                            .reveal section { box-sizing: border-box; overflow-wrap: anywhere; }
                            .reveal img { max-width: 100%; height: auto; }
                            .editor-active-element {
                                outline: 3px solid #ff79c6 !important;
                                outline-offset: 5px;
                            }
                            ${previewEditingEnabled ? '[data-editor-node] { cursor: pointer; } [data-editor-node]:hover { outline: 2px dashed rgba(255, 121, 198, 0.7); outline-offset: 3px; }' : ''}
                        </style>
                        <div class="reveal">
                            <div class="slides" style="display: block;">${previewSlide.outerHTML}</div>
                        </div>
                        ${scriptHTML}
                        <script>
                            const previewEditingEnabled = ${previewEditingEnabled ? 'true' : 'false'};
                            const updateFragmentNavigation = () => {
                                if (typeof Reveal === 'undefined') return;
                                const fragments = Reveal.getCurrentSlide().querySelectorAll('.fragment');
                                const rawFragmentIndex = Reveal.getIndices().f;
                                const fragmentIndex = Number.isInteger(rawFragmentIndex) ? rawFragmentIndex : -1;
                                const slide = Reveal.getCurrentSlide();
                                const slideBounds = slide?.getBoundingClientRect();
                                const overflow = slideBounds && Array.from(slide.children).some((element) => {
                                    const position = getComputedStyle(element).position;
                                    if (position === 'absolute' || position === 'fixed' || element.matches('aside.notes')) return false;
                                    const bounds = element.getBoundingClientRect();
                                    if (bounds.width === 0 && bounds.height === 0) return false;
                                    return bounds.left < slideBounds.left - 4 || bounds.right > slideBounds.right + 4 || bounds.top < slideBounds.top - 4 || bounds.bottom > slideBounds.bottom + 4;
                                });
                                const missingAssets = Array.from(document.images)
                                    .filter((image) => !image.complete || image.naturalWidth === 0)
                                    .map((image) => image.currentSrc || image.src);
                                parent.postMessage({
                                    type: 'fragment-state',
                                    canPrevious: fragmentIndex >= 0,
                                    canNext: fragmentIndex < fragments.length - 1,
                                    fragmentIndex,
                                    overflow,
                                    missingAssets,
                                }, '*');
                            };
                            window.addEventListener('message', (event) => {
                                if (event.data?.type === 'editor-selection') {
                                    if (!previewEditingEnabled) return;
                                    document.querySelectorAll('.editor-active-element').forEach((element) => {
                                        element.classList.remove('editor-active-element');
                                    });
                                    const nodeIndex = event.data.nodeIndex;
                                    if (nodeIndex === null || nodeIndex === undefined) return;
                                    const selectedElement = document.querySelector('[data-editor-node="' + nodeIndex + '"]');
                                    selectedElement?.classList.add('editor-active-element');
                                }
                                if (event.data?.type === 'clear-editor-selection') {
                                    document.querySelectorAll('.editor-active-element').forEach((element) => {
                                        element.classList.remove('editor-active-element');
                                    });
                                }
                                if (event.data?.type === 'preview-fragment' && typeof Reveal !== 'undefined') {
                                    if (event.data.direction === 'next') Reveal.next();
                                    if (event.data.direction === 'previous') Reveal.prev();
                                    window.setTimeout(updateFragmentNavigation, 0);
                                }
                                if (event.data?.type === 'reveal-layout' && typeof Reveal !== 'undefined') {
                                    Reveal.layout();
                                    updateFragmentNavigation();
                                }
                            });
                            document.addEventListener('click', (event) => {
                                if (!previewEditingEnabled) return;
                                const selectedElement = event.target.closest?.('[data-editor-node]');
                                if (!selectedElement || selectedElement.closest('aside.notes')) return;
                                if (selectedElement.closest('a')) event.preventDefault();
                                selectedElement.focus();
                                const selection = window.getSelection();
                                const range = document.createRange();
                                range.selectNodeContents(selectedElement);
                                range.collapse(false);
                                selection.removeAllRanges();
                                selection.addRange(range);
                                parent.postMessage({
                                    type: 'preview-element-selected',
                                    nodeIndex: Number(selectedElement.dataset.editorNode),
                                }, '*');
                            });
                            document.addEventListener('input', () => {
                                if (!previewEditingEnabled) return;
                                const selection = window.getSelection();
                                const anchorElement = selection?.anchorNode?.nodeType === Node.ELEMENT_NODE
                                    ? selection.anchorNode
                                    : selection?.anchorNode?.parentElement;
                                const editedElement = anchorElement?.closest?.('[data-editor-node]');
                                if (!editedElement || editedElement.closest('aside.notes')) return;
                                parent.postMessage({
                                    type: 'preview-content-input',
                                    nodeIndex: Number(editedElement.dataset.editorNode),
                                    innerHTML: editedElement.innerHTML,
                                }, '*');
                            });
                            if (typeof Reveal !== 'undefined') {
                                const plugins = [];
                                if (typeof RevealNotes !== 'undefined') plugins.push(RevealNotes);
                                if (typeof RevealHighlight !== 'undefined') plugins.push(RevealHighlight);
                                Reveal.initialize({
                                    controls: false,
                                    progress: false,
                                    autoPlayMedia: false,
                                    embedded: true,
                                    width: 960,
                                    height: 700,
                                    margin: 0.04,
                                    minScale: 0.2,
                                    maxScale: 2,
                                    plugins,
                                }).then(() => {
                                    const fragments = Reveal.getCurrentSlide().querySelectorAll('.fragment');
                                    const requestedFragment = ${Number.isInteger(initialFragmentIndex) ? initialFragmentIndex : -1};
                                    const restoredFragment = Math.min(requestedFragment, fragments.length - 1);
                                    if (restoredFragment >= 0) Reveal.slide(0, 0, restoredFragment);
                                    updateFragmentNavigation();
                                });
                                Reveal.on('ready', updateFragmentNavigation);
                                Reveal.on('fragmentshown', updateFragmentNavigation);
                                Reveal.on('fragmenthidden', updateFragmentNavigation);
                            }
                        <\/script>
                    </body>
                </html>`;
            }

            function buildThumbnailDoc(currentSlide, scale = 0.23) {
                const thumbnailHead = presentationDoc.head.cloneNode(true);
                thumbnailHead.querySelectorAll('script').forEach((script) => script.remove());
                thumbnailHead.querySelectorAll('base').forEach((base) => base.remove());
                const baseElement = presentationDoc.createElement('base');
                baseElement.href = previewBaseUrl();
                thumbnailHead.prepend(baseElement);

                const thumbnailSlide = currentSlide.cloneNode(true);
                thumbnailSlide.removeAttribute('contenteditable');
                thumbnailSlide.removeAttribute('spellcheck');
                thumbnailSlide.querySelectorAll('[contenteditable]').forEach((element) => element.removeAttribute('contenteditable'));
                thumbnailSlide.querySelectorAll('aside.notes').forEach((element) => element.remove());
                rewriteLocalAssetReferences(thumbnailHead);
                rewriteLocalAssetReferences(thumbnailSlide);

                return `<html style="background-color: #000;">
                    <head>${thumbnailHead.innerHTML}</head>
                    <body>
                        <style>
                            html, body { width: ${960 * scale}px; height: ${700 * scale}px; margin: 0; overflow: hidden; }
                            .thumbnail-stage { width: 960px; height: 700px; overflow: hidden; transform: scale(${scale}); transform-origin: top left; }
                            .reveal { width: 960px; height: 700px; font-size: 20px !important; }
                            .reveal .slides { position: static !important; width: 960px !important; height: 700px !important; transform: none !important; }
                            .reveal .slides > section,
                            .reveal .slides > section.present { display: block !important; position: static !important; visibility: visible !important; opacity: 1 !important; transform: none !important; width: 960px !important; height: 700px !important; min-height: 700px !important; margin: 0 !important; padding: 5% !important; box-sizing: border-box !important; overflow: hidden !important; }
                            .reveal h1 { font-size: 2.4em !important; line-height: 1.05 !important; margin: 0.15em 0 !important; }
                            .reveal h2 { font-size: 1.8em !important; line-height: 1.08 !important; margin: 0.15em 0 !important; }
                            .reveal h3, .reveal h4, .reveal h5, .reveal h6 { font-size: 1.35em !important; line-height: 1.1 !important; margin: 0.12em 0 !important; }
                            .reveal p, .reveal li, .reveal td, .reveal th, .reveal blockquote { font-size: 0.78em !important; line-height: 1.15 !important; }
                            .reveal ul, .reveal ol { margin: 0.25em 0 !important; padding-left: 1.1em !important; }
                            .reveal img, .reveal svg, .reveal video { max-width: 46% !important; max-height: 42% !important; }
                            .reveal table { font-size: 0.75em !important; }
                            .reveal .fragment { visibility: visible !important; opacity: 1 !important; }
                            .reveal aside.notes { display: none !important; }
                        </style>
                        <div class="thumbnail-stage"><div class="reveal"><div class="slides">${thumbnailSlide.outerHTML}</div></div></div>
                    </body>
                </html>`;
            }

            function renderSlide(index) {
                if (index < 0 || index >= slideElements.length) return;
                captureEditorViewState();
                currentSlideIndex = index;
                clearTimeout(previewUpdateTimer);
                previewUpdateTimer = null;
                previewGeneration += 1;

                // 1. Update editors
                const currentSlide = slideElements[index];

                // To avoid showing the speaker notes in the main content editor, we'll build the content string manually.
                let slideContent = '';
                currentSlide.childNodes.forEach(child => {
                    if (child.nodeType === Node.ELEMENT_NODE && child.matches('aside.notes')) {
                        // Skip notes
                    } else {
                        slideContent += child.outerHTML || child.textContent;
                    }
                });
                contentEditor.value = slideContent;

                const notesEl = directNotesElement(currentSlide);
                notesEditor.value = notesEl ? notesEl.innerHTML : '';

                updateHighlights();
                restoreEditorViewState(currentSlide);

                // 2. Update navigation
                slideNavDisplay.textContent = `Slide ${index + 1} / ${slideElements.length}`;
                prevBtn.disabled = index === 0;
                nextBtn.disabled = index === slideElements.length - 1;
                previewPrevPageBtn.disabled = index === 0;
                previewNextPageBtn.disabled = index === slideElements.length - 1;
                previewPrevFragmentBtn.disabled = true;
                previewNextFragmentBtn.disabled = true;
                updateSlideOverviewSelection();

                setPreviewStatus('Loading preview…');
                previewFrame.srcdoc = buildPreviewDoc(currentSlide, fragmentState.get(currentSlide) ?? -1);
            }

            function applyEditorValuesToSlide(currentSlide) {
                const notesValue = notesEditor.value;
                let notesEl = directNotesElement(currentSlide);
                const childNodes = Array.from(currentSlide.childNodes);
                const notesIndex = notesEl ? childNodes.indexOf(notesEl) : -1;
                const firstContentIndex = childNodes.findIndex((node, index) => {
                    if (index === notesIndex) return false;
                    return node.nodeType === Node.ELEMENT_NODE || node.textContent.trim();
                });
                const notesWereFirst = notesIndex >= 0 && (firstContentIndex < 0 || notesIndex < firstContentIndex);

                const template = presentationDoc.createElement('template');
                template.innerHTML = contentEditor.value;
                const contentNodes = Array.from(template.content.childNodes);

                if (notesValue !== '') {
                    if (!notesEl) {
                        notesEl = presentationDoc.createElement('aside');
                        notesEl.className = 'notes';
                    }
                    // Keep the exact text/HTML entered by the user. Trimming here
                    // made whitespace edits appear to do nothing.
                    notesEl.innerHTML = notesValue;
                } else if (notesEl) {
                    notesEl.remove();
                    notesEl = null;
                }

                Array.from(currentSlide.childNodes).forEach((node) => {
                    if (node !== notesEl) node.remove();
                });

                const insertContent = (referenceNode = null) => {
                    contentNodes.forEach((node) => {
                        const nextNode = node.cloneNode(true);
                        if (referenceNode) currentSlide.insertBefore(nextNode, referenceNode);
                        else currentSlide.appendChild(nextNode);
                    });
                };

                if (notesEl && !notesWereFirst) insertContent(notesEl);
                else insertContent();
            }

            function updateAndPreview({ previewImmediately = false } = {}) {
                if (!presentationDoc || slideElements.length === 0) return;

                const currentSlide = slideElements[currentSlideIndex];
                applyEditorValuesToSlide(currentSlide);
                updateHighlights();
                setDirty(true);

                // Refresh the iframe after editing pauses, but restore the current
                // fragment state so the preview does not jump backward.
                clearTimeout(previewUpdateTimer);
                const generation = ++previewGeneration;
                const renderPreview = () => {
                    if (generation !== previewGeneration || currentSlide !== slideElements[currentSlideIndex]) return;
                    previewFrame.srcdoc = buildPreviewDoc(currentSlide, fragmentState.get(currentSlide) ?? -1);
                    previewUpdateTimer = null;
                    setPreviewStatus('Loading preview…');
                    scheduleSlideOverviewRefresh();
                };
                if (previewImmediately) renderPreview();
                else previewUpdateTimer = setTimeout(renderPreview, 250);
            }

            function refreshCurrentPreview() {
                const currentSlide = slideElements[currentSlideIndex];
                if (!currentSlide) return;
                clearTimeout(previewUpdateTimer);
                previewUpdateTimer = null;
                previewGeneration += 1;
                setPreviewStatus('Loading preview…');
                previewFrame.srcdoc = buildPreviewDoc(currentSlide, fragmentState.get(currentSlide) ?? -1);
                scheduleSlideOverviewRefresh();
            }

            function presentationBlob() {
                updateAndPreview({ previewImmediately: true });
                const fullHtml = '<!DOCTYPE html>\n' + presentationDoc.documentElement.outerHTML;
                return new Blob([fullHtml], { type: 'text/html' });
            }

            async function writeToFileHandle(handle, blob) {
                if (handle.requestPermission) {
                    const permission = await handle.requestPermission({ mode: 'readwrite' });
                    if (permission !== 'granted') throw new Error('Write permission was not granted.');
                }
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
            }

            async function saveAs() {
                if (!presentationDoc) return;
                const blob = presentationBlob();

                if ('showSaveFilePicker' in window) {
                    const handle = await window.showSaveFilePicker({
                        id: 'reveal-editor-save-html',
                        suggestedName: originalFileName,
                        startIn: currentFileHandle || 'downloads',
                        types: [{
                            description: 'HTML Files',
                            accept: { 'text/html': ['.html'] },
                        }],
                    });
                    await writeToFileHandle(handle, blob);
                    currentFileHandle = handle;
                    originalFileName = handle.name || originalFileName;
                    fileNameDisplay.textContent = originalFileName;
                } else {
                    const link = document.createElement('a');
                    const objectUrl = URL.createObjectURL(blob);
                    link.href = objectUrl;
                    link.download = `edited_${originalFileName}`;
                    link.click();
                    window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
                }

                setDirty(false);
                setPreviewStatus('Saved');
            }

            saveBtn.addEventListener('click', async () => {
                if (!presentationDoc) return;
                try {
                    if (currentFileHandle) {
                        await writeToFileHandle(currentFileHandle, presentationBlob());
                        setDirty(false);
                        setPreviewStatus('Saved');
                    } else {
                        await saveAs();
                    }
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        setPreviewStatus(`Save failed: ${error.message}`, 'error');
                        console.error('Error saving file:', error);
                    }
                }
            });

            saveAsBtn.addEventListener('click', async () => {
                try {
                    await saveAs();
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        setPreviewStatus(`Save failed: ${error.message}`, 'error');
                        console.error('Error saving file:', error);
                    }
                }
            });

            contentEditor.addEventListener('input', () => updateAndPreview());
            notesEditor.addEventListener('input', () => updateAndPreview());
            refreshPreviewButton.addEventListener('click', refreshCurrentPreview);
            assetBaseUrlInput.addEventListener('change', refreshCurrentPreview);
            contentEditor.addEventListener('click', showSelectedElementInPreview);
            contentEditor.addEventListener('keyup', showSelectedElementInPreview);
            contentEditor.addEventListener('select', showSelectedElementInPreview);
            previewFrame.addEventListener('load', showSelectedElementInPreview);

            // Sync scrolling for highlighters
            const syncBackdropScroll = (editor, backdrop) => {
                backdrop.scrollTop = editor.scrollTop;
                backdrop.scrollLeft = editor.scrollLeft;
            };
            contentEditor.addEventListener('scroll', () => syncBackdropScroll(contentEditor, contentBackdrop));
            notesEditor.addEventListener('scroll', () => syncBackdropScroll(notesEditor, notesBackdrop));

            // Track last focused editor for replace functionality
            contentEditor.addEventListener('focus', () => lastFocusedEditor = contentEditor);
            notesEditor.addEventListener('focus', () => lastFocusedEditor = notesEditor);

            prevBtn.addEventListener('click', () => renderSlide(currentSlideIndex - 1));
            nextBtn.addEventListener('click', () => renderSlide(currentSlideIndex + 1));
            previewPrevPageBtn.addEventListener('click', () => renderSlide(currentSlideIndex - 1));
            previewNextPageBtn.addEventListener('click', () => renderSlide(currentSlideIndex + 1));
            previewPrevFragmentBtn.addEventListener('click', () => movePreviewFragment('previous'));
            previewNextFragmentBtn.addEventListener('click', () => movePreviewFragment('next'));

            // --- Find and Replace Logic ---
            const toggleFindPanel = () => {
                if (findPanel.style.display === 'block') {
                    findPanel.style.display = 'none';
                } else {
                    findPanel.style.display = 'block';
                    findInput.focus();
                    findInput.select();
                }
            };

            findButton.addEventListener('click', toggleFindPanel);
            closeFindPanelBtn.addEventListener('click', () => findPanel.style.display = 'none');
            spellcheckButton.addEventListener('click', () => setSpellcheck(!spellcheckEnabled));
            grammarButton.addEventListener('click', checkGrammar);
            closeWritingResultsBtn.addEventListener('click', () => writingResults.style.display = 'none');
            writingResultsHandle.addEventListener('pointerdown', startWritingResultsDrag);
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    saveBtn.click();
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    saveAsBtn.click();
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    toggleFindPanel();
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'e') {
                    e.preventDefault();
                    toggleEditors();
                }
                if (e.key === 'Escape' && findPanel.style.display === 'block') {
                    findPanel.style.display = 'none';
                }
            });

            window.addEventListener('beforeunload', (event) => {
                if (!isDirty) return;
                event.preventDefault();
                event.returnValue = '';
            });

            function updateHighlights() {
                const searchTerm = findInput.value;
                const regex = searchTerm ? new RegExp(escapeRegExp(searchTerm), 'gi') : null;
                let totalMatches = 0;

                const escapeHTML = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                const getHtmlSyntax = (text) => {
                    const syntax = Array(text.length).fill('');
                    const applySyntax = (start, end, className) => {
                        for (let index = start; index < end; index += 1) syntax[index] = className;
                    };
                    const tagPattern = /<!--[\s\S]*?-->|<\/?[A-Za-z][^>]*>/g;
                    let tagMatch;

                    while ((tagMatch = tagPattern.exec(text)) !== null) {
                        const tag = tagMatch[0];
                        const start = tagMatch.index;
                        const end = start + tag.length;

                        if (tag.startsWith('<!--')) {
                            applySyntax(start, end, 'syntax-comment');
                            continue;
                        }

                        applySyntax(start, start + 1, 'syntax-punctuation');
                        applySyntax(end - 1, end, 'syntax-punctuation');
                        if (tag.endsWith('/>')) applySyntax(end - 2, end - 1, 'syntax-punctuation');
                        const tagNameMatch = /^<\s*(\/?)\s*([A-Za-z][\w:-]*)/.exec(tag);
                        if (!tagNameMatch) continue;

                        const nameStart = start + tagNameMatch[0].lastIndexOf(tagNameMatch[2]);
                        applySyntax(nameStart, nameStart + tagNameMatch[2].length, 'syntax-tag');
                        if (tagNameMatch[1]) applySyntax(start + tag.indexOf('/'), start + tag.indexOf('/') + 1, 'syntax-punctuation');

                        const attributesStart = tagNameMatch[0].length;
                        const attributes = tag.slice(attributesStart, -1);
                        const attributePattern = /([:@A-Za-z_][\w:.-]*)(\s*=\s*)("[^"]*"|'[^']*'|[^\s"'=<>`]+)/g;
                        let attributeMatch;
                        while ((attributeMatch = attributePattern.exec(attributes)) !== null) {
                            const attributeStart = start + attributesStart + attributeMatch.index;
                            applySyntax(attributeStart, attributeStart + attributeMatch[1].length, 'syntax-attribute');
                            const valueStart = attributeStart + attributeMatch[1].length + attributeMatch[2].length;
                            applySyntax(valueStart, valueStart + attributeMatch[3].length, 'syntax-value');
                        }
                    }

                    return syntax;
                };

                const highlight = (text, useHtmlSyntax = false) => {
                    if (!text) return '';
                    const syntax = useHtmlSyntax ? getHtmlSyntax(text) : Array(text.length).fill('');
                    const matches = Array(text.length).fill(false);
                    let match;
                    if (regex) {
                        while ((match = regex.exec(text)) !== null) {
                            for (let index = match.index; index < match.index + match[0].length; index += 1) matches[index] = true;
                            totalMatches += 1;
                        }
                    }

                    let result = '';
                    let runStart = 0;
                    for (let index = 1; index <= text.length; index += 1) {
                        if (index === text.length || syntax[index] !== syntax[runStart] || matches[index] !== matches[runStart]) {
                            const escapedText = escapeHTML(text.slice(runStart, index));
                            const coloredText = syntax[runStart] ? `<span class="${syntax[runStart]}">${escapedText}</span>` : escapedText;
                            result += matches[runStart] ? `<mark>${coloredText}</mark>` : coloredText;
                            runStart = index;
                        }
                    }
                    return result;
                };

                contentBackdrop.innerHTML = highlight(contentEditor.value, true);
                notesBackdrop.innerHTML = highlight(notesEditor.value);
                findResultsDisplay.textContent = `${totalMatches} match${totalMatches !== 1 ? 'es' : ''}`;
            }

            findInput.addEventListener('input', updateHighlights);

            replaceAllBtn.addEventListener('click', () => {
                const find = findInput.value;
                const replace = replaceInput.value;
                if (!find) return;

                const regex = new RegExp(escapeRegExp(find), 'gi');
                contentEditor.value = contentEditor.value.replace(regex, () => replace);
                notesEditor.value = notesEditor.value.replace(regex, () => replace);

                updateAndPreview();
            });

            replaceBtn.addEventListener('click', () => {
                const find = findInput.value;
                const replace = replaceInput.value;
                if (!find) return;

                const activeEditor = lastFocusedEditor;
                if (!activeEditor || activeEditor.tagName !== 'TEXTAREA') {
                    alert('Please click inside the "Slide Content" or "Speaker Notes" editor first.');
                    return;
                }

                const text = activeEditor.value;
                const selectionStart = activeEditor.selectionStart;
                const selectionEnd = activeEditor.selectionEnd;
                const selectedText = text.substring(selectionStart, selectionEnd);

                // If the selected text matches the find term, replace it and find the next one.
                if (selectedText.toLocaleLowerCase() === find.toLocaleLowerCase()) {
                    const newText = text.substring(0, selectionStart) + replace + text.substring(selectionEnd);
                    activeEditor.value = newText;
                    updateAndPreview();

                    // After replacing, find and select the next occurrence.
                    const nextMatch = activeEditor.value.substring(selectionStart + replace.length).search(new RegExp(escapeRegExp(find), 'i'));
                    if (nextMatch !== -1) {
                        const nextStart = selectionStart + replace.length + nextMatch;
                        activeEditor.setSelectionRange(nextStart, nextStart + find.length);
                        activeEditor.focus(); // Bring focus back to the editor
                    }
                } else {
                    // If no text is selected, or the selection doesn't match, find the next occurrence.
                    // Start search from the beginning of the text to be more intuitive.
                    let nextMatch = text.search(new RegExp(escapeRegExp(find), 'i'));

                    // If a match is found, select it.
                    if (nextMatch !== -1) {
                        activeEditor.setSelectionRange(nextMatch, nextMatch + find.length);
                        activeEditor.focus(); // Bring focus back to the editor
                    } else {
                        // If no matches are found from the beginning, then there are truly no matches.
                        alert('No more matches found on this slide.');
                    }
                }
            });

            state.disable();
        });
    </script>
</body>

</html>
