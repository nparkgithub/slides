<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal.js Editor</title>
    <style>
        :root {
            --bg-color: #282a36;
            --fg-color: #f8f8f2;
            --panel-bg: #44475a;
            --border-color: #6272a4;
            --button-bg: #50fa7b;
            --button-text: #282a36;
            --input-bg: #20222b;
            --highlight-bg: #f1c40f;
            --syntax-punctuation: #ff79c6;
            --syntax-tag: #8be9fd;
            --syntax-attribute: #50fa7b;
            --syntax-value: #f1fa8c;
            --syntax-comment: #6272a4;
            --fragment-end-bg: #6b3b4a;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--fg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.2em;
            margin: 0;
        }

        header>* {
            margin-right: 0;
        }

        button,
        input[type="file"] {
            font-size: 14px;
        }

        button {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }

        .main-container {
            --editor-panel-width: 30%;
            display: flex;
            flex: 1 1 0;
            height: 0;
            overflow: hidden;
            min-height: 0;
        }

        .editor-panel {
            flex: 0 0 var(--editor-panel-width);
            width: auto;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-right: 2px solid var(--border-color);
            min-height: 0;
        }

        .editor-preview-divider {
            flex: 0 0 8px;
            width: 8px;
            position: relative;
            z-index: 3;
            background-color: var(--border-color);
            cursor: col-resize;
            touch-action: none;
        }

        .editor-preview-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 44px;
            border-radius: 2px;
            background-color: var(--fg-color);
            opacity: 0.45;
            transform: translate(-50%, -50%);
        }

        .editor-preview-divider:hover,
        .editor-preview-divider.is-dragging,
        .editor-preview-divider:focus-visible {
            background-color: var(--button-bg);
            outline: none;
        }

        .editor-preview-divider:focus-visible::after,
        .editor-preview-divider:hover::after,
        .editor-preview-divider.is-dragging::after {
            opacity: 0.9;
        }

        .main-container.editors-hidden .editor-preview-divider {
            display: none;
        }

        body.is-resizing-editor,
        body.is-resizing-editor * {
            cursor: col-resize !important;
            user-select: none !important;
        }

        .preview-panel {
            flex: 1 1 auto;
            width: auto;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
            min-width: 0;
            height: 100%;
            overflow: hidden;
        }

        .slide-overview {
            flex: 0 0 250px;
            width: 250px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background-color: var(--panel-bg);
            border-left: 2px solid var(--border-color);
        }

        .slide-overview.is-hidden {
            display: none;
        }

        .slide-overview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .slide-overview-header h2 {
            margin: 0;
            font-size: 14px;
        }

        .slide-overview-actions {
            display: flex;
            gap: 5px;
        }

        .slide-overview-actions button {
            padding: 5px 7px;
            font-size: 12px;
        }

        .slide-overview-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: auto;
            min-height: 0;
            padding: 10px;
        }

        .slide-overview-empty {
            margin: 8px 2px;
            color: #c5c7d0;
            font-size: 13px;
            line-height: 1.4;
        }

        .slide-thumbnail {
            display: block;
            flex: 0 0 auto;
            padding: 6px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--fg-color);
            cursor: grab;
            outline: none;
        }

        .slide-thumbnail:active {
            cursor: grabbing;
        }

        .slide-thumbnail:focus-visible,
        .slide-thumbnail.is-current {
            border-color: var(--syntax-punctuation);
            box-shadow: 0 0 0 2px rgba(255, 121, 198, 0.25);
        }

        .slide-thumbnail.is-drag-over {
            border-color: var(--button-bg);
            box-shadow: 0 0 0 2px rgba(80, 250, 123, 0.25);
        }

        .slide-thumbnail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            min-height: 25px;
            margin-bottom: 5px;
        }

        .slide-thumbnail-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.01em;
        }

        .slide-thumbnail-delete {
            flex: 0 0 auto;
            padding: 2px 6px;
            border: 1px solid rgba(255, 121, 198, 0.7);
            background: var(--fragment-end-bg);
            color: var(--fg-color);
            font-size: 12px;
        }

        .slide-thumbnail-frame {
            display: block;
            width: 100%;
            aspect-ratio: 960 / 700;
            border: 1px solid var(--border-color);
            background: #000;
            pointer-events: none;
        }

        .slide-thumbnail:hover {
            border-color: var(--syntax-tag);
        }

        .main-container.editors-hidden .editor-panel {
            display: none;
        }

        .main-container.editors-hidden .preview-panel {
            flex: 1 1 auto;
            width: auto;
            align-items: stretch;
            justify-content: stretch;
        }

        .main-container.editors-hidden #preview-frame {
            width: 100%;
            height: 100%;
            max-width: none;
            flex: 1 1 auto;
            aspect-ratio: auto;
        }

        .editor-box {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-bottom: 10px;
            min-height: 0;
        }

        .editor-box:last-child {
            margin-bottom: 0;
        }

        .editor-box label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .editor-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            min-height: 0;
        }

        textarea {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--fg-color);
            border: none;
            border-radius: 5px;
            font-family: "Fira Code", "Courier New", monospace;
            font-size: 14px;
            padding: 10px;
            resize: none;
            overflow: auto;
            position: absolute;
            top: 0;
            left: 0;
            background: transparent;
            caret-color: var(--fg-color);
        }

        #content-editor {
            color: transparent;
        }

        #content-editor::selection {
            color: var(--fg-color);
            background-color: rgba(139, 233, 253, 0.35);
        }

        .editor-highlight-backdrop {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--fg-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-family: "Fira Code", "Courier New", monospace;
            font-size: 14px;
            padding: 10px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .editor-highlight-backdrop mark {
            background-color: var(--highlight-bg);
            color: inherit;
            border-radius: 2px;
        }

        .syntax-punctuation { color: var(--syntax-punctuation); }
        .syntax-tag { color: var(--syntax-tag); }
        .syntax-attribute { color: var(--syntax-attribute); }
        .syntax-value { color: var(--syntax-value); }
        .syntax-comment { color: var(--syntax-comment); }

        #preview-frame {
            display: block;
            width: 100%;
            height: auto;
            min-height: 0;
            flex: 1 1 auto;
            border: none;
            background-color: #fff;
        }

        .preview-navigation {
            position: absolute;
            right: 16px;
            bottom: 16px;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3, 46px);
            grid-template-areas:
                ". up ."
                "left . right"
                ". down .";
            gap: 8px;
        }

        .preview-navigation button {
            width: 46px;
            height: 46px;
            padding: 0;
            border: 1px solid rgba(248, 248, 242, 0.5);
            border-radius: 50%;
            background-color: rgba(40, 42, 54, 0.88);
            color: var(--fg-color);
            font-size: 24px;
            line-height: 1;
        }

        .preview-navigation button:not(:disabled) {
            background-color: var(--button-bg);
            color: var(--button-text);
            border-color: rgba(248, 248, 242, 0.8);
        }

        .preview-navigation button:hover:not(:disabled),
        .preview-navigation button:focus-visible:not(:disabled) {
            background-color: var(--button-bg);
            color: var(--button-text);
            outline: 2px solid var(--fg-color);
            outline-offset: 2px;
        }

        #preview-prev-page { grid-area: left; }
        #preview-next-page { grid-area: right; }
        #preview-prev-fragment { grid-area: up; }
        #preview-next-fragment { grid-area: down; }

        #preview-prev-fragment:disabled,
        #preview-next-fragment:disabled {
            background-color: var(--fragment-end-bg);
            color: #d7b4bc;
        }

        .preview-navigation button:disabled {
            background-color: rgba(40, 42, 54, 0.72);
            color: #9b9eae;
            opacity: 0.72;
        }

        #preview-prev-fragment:disabled,
        #preview-next-fragment:disabled {
            background-color: var(--fragment-end-bg);
            color: #d7b4bc;
        }

        .editor-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 5px;
        }

        .editor-selection-status {
            color: var(--syntax-punctuation);
            font-size: 11px;
            font-weight: normal;
            min-height: 1em;
        }

        .editor-box.source-selected {
            outline: 2px solid var(--syntax-punctuation);
            outline-offset: -2px;
        }

        .editor-label-row label {
            margin-bottom: 0;
        }

        .editor-toggle-button {
            padding: 4px 8px;
            font-size: 12px;
        }

        .editor-box.is-hidden {
            display: none;
        }

        #slide-nav {
            font-weight: bold;
        }

        #file-name {
            font-style: italic;
            color: #ccc;
        }

        #grammar-status {
            font-size: 12px;
            color: #ccc;
        }

        #preview-status {
            min-width: 180px;
            font-size: 12px;
            color: #ccc;
        }

        #preview-status.is-warning {
            color: #ffb86c;
        }

        #preview-status.is-error {
            color: #ff79c6;
        }

        #source-url,
        #asset-base-url {
            width: 190px;
            box-sizing: border-box;
            padding: 7px 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--fg-color);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 900px) {
            .editor-panel { flex-basis: var(--editor-panel-width); }
            .preview-panel { width: auto; }

            #source-url,
            #asset-base-url {
                width: 150px;
            }
        }

        @media (max-width: 680px) {
            .main-container {
                flex-direction: column;
                overflow: auto;
            }

            .editor-panel,
            .preview-panel {
                width: 100%;
                flex: 1 1 50%;
            }

            .editor-preview-divider {
                display: none;
            }

            .preview-panel {
                min-height: 360px;
            }

            .slide-overview {
                flex: 0 0 30%;
                width: 100%;
                max-height: 320px;
                border-top: 2px solid var(--border-color);
                border-left: 0;
            }
        }

        #writing-results {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 1001;
            display: none;
            width: min(420px, calc(100vw - 40px));
            max-height: min(55vh, 520px);
            overflow: auto;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .writing-results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            cursor: grab;
            user-select: none;
        }

        .writing-results-header:active {
            cursor: grabbing;
        }

        #writing-results h3 {
            margin: 0;
            font-size: 1em;
        }

        #writing-results .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            padding: 0 3px;
        }

        .writing-issue {
            margin-top: 8px;
            padding: 9px;
            border-left: 3px solid #ffb86c;
            background: rgba(0, 0, 0, 0.14);
            font-size: 13px;
            line-height: 1.35;
        }

        .writing-issue strong,
        .writing-issue code {
            color: #f1fa8c;
        }

        #find-replace-panel {
            position: fixed;
            top: 60px;
            right: 20px;
            z-index: 1001;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: none;
            width: 300px;
        }

        #find-replace-panel h3 {
            margin-top: 0;
            font-size: 1em;
        }

        #find-replace-panel input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-bottom: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--fg-color);
            border-radius: 4px;
        }

        #find-replace-panel .find-controls {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        #find-replace-panel .find-controls button {
            flex-grow: 1;
        }

        #find-replace-panel .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
        }
    </style>
</head>

<body>

    <header>
        <h1>Reveal.js Editor</h1>
        <button id="load-button">Load File</button>
        <input type="file" id="file-input" accept=".html" style="display: none;">
        <span id="file-name">No file loaded</span>
        <label for="source-url" class="sr-only">Deck URL</label>
        <input id="source-url" type="url" placeholder="Deck URL (optional)" title="Load a deck from a URL or repository path">
        <button id="load-url-button" type="button">Load URL</button>
        <label for="asset-base-url" class="sr-only">Asset base URL</label>
        <input id="asset-base-url" type="text" placeholder="Asset base URL, e.g. docs/romans/" title="Base URL used for relative images, fonts, and other assets">
        <button id="choose-asset-folder-button" type="button" disabled title="Choose the folder containing this deck and its local assets">Choose Asset Folder</button>
        <button id="toggle-editors-button" type="button" aria-controls="editor-panel" aria-expanded="true">Hide Editors</button>
        <button id="toggle-content-editor-button" type="button" aria-controls="content-editor-box" aria-expanded="true">Hide Slide Editor</button>
        <button id="toggle-notes-editor-button" type="button" aria-controls="notes-editor-box" aria-expanded="true">Hide Speaker Notes</button>
        <button id="toggle-slide-overview-button" type="button" aria-controls="slide-overview" aria-expanded="false">Show Slide Overview</button>
        <div id="navigation-controls" style="display: none;">
            <button id="prev-slide">◀ Prev</button>
            <span id="slide-nav">Slide 0 / 0</span>
            <button id="next-slide">Next ▶</button>
        </div>
        <button id="find-button">Find (Ctrl+F)</button>
        <button id="spellcheck-button" type="button">Spell: On</button>
        <button id="grammar-button" type="button" disabled>Grammar Check</button>
        <span id="grammar-status" aria-live="polite"></span>
        <span id="preview-status" aria-live="polite"></span>
        <button id="refresh-preview-button" type="button" disabled>Refresh Preview</button>
        <button id="toggle-preview-editing-button" type="button" disabled aria-pressed="true">Disable Preview Editing</button>
        <button id="reload-file-button" type="button" disabled title="Reload the currently loaded HTML file">Reload File</button>
        <button id="save-button" disabled>Save</button>
        <button id="save-as-button" type="button" disabled>Save As…</button>
    </header>

    <div id="find-replace-panel">
        <button class="close-btn" id="close-find-panel">×</button>
        <h3>Find & Replace</h3>
        <input type="text" id="find-input" placeholder="Find...">
        <input type="text" id="replace-input" placeholder="Replace with...">
        <div class="find-controls">
            <button id="replace-btn">Replace</button>
            <button id="replace-all-btn">Replace All</button>
        </div>
        <div style="margin-top: 10px; font-size: 12px; text-align: center;" id="find-results">0 matches</div>
    </div>

    <div id="writing-results" role="status" aria-live="polite">
        <div class="writing-results-header" id="writing-results-handle">
            <h3>Writing suggestions</h3>
            <button class="close-btn" id="close-writing-results" aria-label="Close writing results">×</button>
        </div>
        <div id="writing-results-list"></div>
    </div>

    <div class="main-container" id="main-container">
        <div class="editor-panel" id="editor-panel">
            <div class="editor-box" id="content-editor-box" style="flex-basis: 65%;">
                <div class="editor-label-row">
                    <label for="content-editor">Slide Content (HTML)</label>
                    <span id="editor-selection-status" class="editor-selection-status" aria-live="polite"></span>
                </div>
                <div class="editor-wrapper">
                    <div id="content-backdrop" class="editor-highlight-backdrop"></div>
                    <textarea id="content-editor" disabled spellcheck="true"></textarea>
                </div>
            </div>
            <div class="editor-box" id="notes-editor-box" style="flex-basis: 35%;">
                <div class="editor-label-row">
                    <label for="notes-editor">Speaker Notes</label>
                </div>
                <div class="editor-wrapper">
                    <div id="notes-backdrop" class="editor-highlight-backdrop"></div>
                    <textarea id="notes-editor" disabled spellcheck="true"></textarea>
                </div>
            </div>
        </div>
        <div id="editor-preview-divider" class="editor-preview-divider" role="separator" aria-label="Resize slide editor and preview" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="55" aria-valuenow="30" tabindex="0" title="Drag to resize editor and preview; double-click to reset"></div>
        <div class="preview-panel">
            <iframe id="preview-frame" title="Slide Preview" sandbox="allow-scripts"></iframe>
            <div class="preview-navigation" aria-label="Content navigation">
                <button id="preview-prev-page" type="button" title="Previous slide" aria-label="Previous slide">←</button>
                <button id="preview-next-page" type="button" title="Next slide" aria-label="Next slide">→</button>
                <button id="preview-prev-fragment" type="button" title="Hide previous content" aria-label="Hide previous content">↑</button>
                <button id="preview-next-fragment" type="button" title="Show next content" aria-label="Show next content">↓</button>
            </div>
        </div>
        <aside id="slide-overview" class="slide-overview is-hidden" aria-label="Slide overview">
            <div class="slide-overview-header">
                <h2>Slides</h2>
                <div class="slide-overview-actions">
                    <button id="undo-delete-slide-button" type="button" disabled title="Undo the last deleted slide">Undo</button>
                    <button id="hide-slide-overview-button" type="button" title="Hide slide overview">Hide</button>
                </div>
            </div>
            <div id="slide-overview-list" class="slide-overview-list" role="list"></div>
        </aside>
    </div>

    <script>
        // Note: For the best experience (native save dialog in the correct folder), use a browser that supports the File System Access API, like Chrome or Edge.
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('file-input');
            const fileNameDisplay = document.getElementById('file-name');
            const sourceUrlInput = document.getElementById('source-url');
            const loadUrlButton = document.getElementById('load-url-button');
            const mainContainer = document.getElementById('main-container');
            const editorPanel = document.getElementById('editor-panel');
            const editorPreviewDivider = document.getElementById('editor-preview-divider');
            const toggleEditorsButton = document.getElementById('toggle-editors-button');
            const contentEditorBox = document.getElementById('content-editor-box');
            const notesEditorBox = document.getElementById('notes-editor-box');
            const toggleContentEditorButton = document.getElementById('toggle-content-editor-button');
            const toggleNotesEditorButton = document.getElementById('toggle-notes-editor-button');
            const toggleSlideOverviewButton = document.getElementById('toggle-slide-overview-button');
            const slideOverview = document.getElementById('slide-overview');
            const slideOverviewList = document.getElementById('slide-overview-list');
            const hideSlideOverviewButton = document.getElementById('hide-slide-overview-button');
            const undoDeleteSlideButton = document.getElementById('undo-delete-slide-button');
            const navControls = document.getElementById('navigation-controls');
            const prevBtn = document.getElementById('prev-slide');
            const nextBtn = document.getElementById('next-slide');
            const previewPrevPageBtn = document.getElementById('preview-prev-page');
            const previewNextPageBtn = document.getElementById('preview-next-page');
            const previewPrevFragmentBtn = document.getElementById('preview-prev-fragment');
            const previewNextFragmentBtn = document.getElementById('preview-next-fragment');
            const slideNavDisplay = document.getElementById('slide-nav');
            const saveBtn = document.getElementById('save-button');
            const saveAsBtn = document.getElementById('save-as-button');
            const contentEditor = document.getElementById('content-editor');
            const notesEditor = document.getElementById('notes-editor');
            const previewFrame = document.getElementById('preview-frame');
            const loadButton = document.getElementById('load-button');
            const findButton = document.getElementById('find-button');
            const findPanel = document.getElementById('find-replace-panel');

            const contentBackdrop = document.getElementById('content-backdrop');

            const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const voidElements = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'param', 'source', 'track', 'wbr']);

            function selectedHtmlElementIndex(text, caretPosition) {
                const tagPattern = /<!--[\s\S]*?-->|<\/?[A-Za-z][^>]*>/g;
                const openElements = [];
                let elementIndex = -1;
                let tagMatch;

                while ((tagMatch = tagPattern.exec(text)) !== null) {
                    const tag = tagMatch[0];
                    const tagStart = tagMatch.index;
                    const tagEnd = tagStart + tag.length;
                    if (tagStart > caretPosition) break;
                    if (tag.startsWith('<!--')) continue;

                    const nameMatch = /^<\s*(\/?)\s*([A-Za-z][\w:-]*)/.exec(tag);
                    if (!nameMatch) continue;
                    const isClosingTag = Boolean(nameMatch[1]);
                    const tagName = nameMatch[2].toLowerCase();

                    if (isClosingTag) {
                        if (caretPosition <= tagEnd) return openElements.at(-1)?.index ?? null;
                        for (let index = openElements.length - 1; index >= 0; index -= 1) {
                            if (openElements[index].name === tagName) {
                                openElements.splice(index, 1);
                                break;
                            }
                        }
                        continue;
                    }

                    elementIndex += 1;
                    const isVoidElement = voidElements.has(tagName) || /\/\s*>$/.test(tag);
                    if (caretPosition <= tagEnd) return elementIndex;
                    if (!isVoidElement) openElements.push({ name: tagName, index: elementIndex });
                }

                return openElements.at(-1)?.index ?? null;
            }

            function htmlRangeForElementIndex(text, targetIndex) {
                const tagPattern = /<!--[\s\S]*?-->|<\/?[A-Za-z][^>]*>/g;
                const openElements = [];
                let elementIndex = -1;
                let tagMatch;

                while ((tagMatch = tagPattern.exec(text)) !== null) {
                    const tag = tagMatch[0];
                    const tagStart = tagMatch.index;
                    const tagEnd = tagStart + tag.length;
                    if (tag.startsWith('<!--')) continue;

                    const nameMatch = /^<\s*(\/?)\s*([A-Za-z][\w:-]*)/.exec(tag);
                    if (!nameMatch) continue;
                    const isClosingTag = Boolean(nameMatch[1]);
                    const tagName = nameMatch[2].toLowerCase();

                    if (isClosingTag) {
                        for (let index = openElements.length - 1; index >= 0; index -= 1) {
                            if (openElements[index].name !== tagName) continue;
                            const element = openElements.splice(index, 1)[0];
                            if (element.index === targetIndex) {
                                return { start: element.start, end: tagEnd };
                            }
                            break;
                        }
                        continue;
                    }

                    elementIndex += 1;
                    const isVoidElement = voidElements.has(tagName) || /\/\s*>$/.test(tag);
                    const element = { name: tagName, index: elementIndex, start: tagStart };
                    if (elementIndex === targetIndex && isVoidElement) {
                        return { start: tagStart, end: tagEnd };
                    }
                    if (!isVoidElement) openElements.push(element);
                }

                const openElement = openElements.find((element) => element.index === targetIndex);
                return openElement ? { start: openElement.start, end: text.length } : null;
            }

            function htmlContentRangeForElementIndex(text, targetIndex) {
                const tagPattern = /<!--[\s\S]*?-->|<\/?[A-Za-z][^>]*>/g;
                const openElements = [];
                let elementIndex = -1;
                let tagMatch;

                while ((tagMatch = tagPattern.exec(text)) !== null) {
                    const tag = tagMatch[0];
                    const tagStart = tagMatch.index;
                    const tagEnd = tagStart + tag.length;
                    if (tag.startsWith('<!--')) continue;

                    const nameMatch = /^<\s*(\/?)\s*([A-Za-z][\w:-]*)/.exec(tag);
                    if (!nameMatch) continue;
                    const isClosingTag = Boolean(nameMatch[1]);
                    const tagName = nameMatch[2].toLowerCase();

                    if (isClosingTag) {
                        for (let index = openElements.length - 1; index >= 0; index -= 1) {
                            if (openElements[index].name !== tagName) continue;
                            const element = openElements.splice(index, 1)[0];
                            if (element.index === targetIndex) {
                                return { start: element.openEnd, end: tagStart };
                            }
                            break;
                        }
                        continue;
                    }

                    elementIndex += 1;
                    const isVoidElement = voidElements.has(tagName) || /\/\s*>$/.test(tag);
                    if (!isVoidElement) openElements.push({ name: tagName, index: elementIndex, openEnd: tagEnd });
                }

                const openElement = openElements.find((element) => element.index === targetIndex);
                return openElement ? { start: openElement.openEnd, end: text.length } : null;
            }

            function selectHtmlElementInEditor(nodeIndex, { focusEditor = false } = {}) {
                if (!presentationDoc || !Number.isInteger(nodeIndex)) return;
                const range = htmlRangeForElementIndex(contentEditor.value, nodeIndex);
                if (!range) return;
                if (focusEditor) contentEditor.focus({ preventScroll: true });
                contentEditor.setSelectionRange(range.start, range.end);
                const lineHeight = parseFloat(getComputedStyle(contentEditor).lineHeight) || 20;
                const lineNumber = contentEditor.value.slice(0, range.start).split('\n').length - 1;
                contentEditor.scrollTop = Math.max(0, lineNumber * lineHeight - contentEditor.clientHeight * 0.25);
                syncBackdropScroll(contentEditor, contentBackdrop);
                const tagMatch = /^<\s*([A-Za-z][\w:-]*)/.exec(contentEditor.value.slice(range.start));
                editorSelectionStatus.textContent = tagMatch ? `Preview points to <${tagMatch[1]}>` : 'Preview selection';
                contentEditorBox.classList.add('source-selected');
                clearTimeout(editorSelectionTimer);
                editorSelectionTimer = setTimeout(() => contentEditorBox.classList.remove('source-selected'), 1800);
                previewFrame.contentWindow?.postMessage({ type: 'editor-selection', nodeIndex }, '*');
            }

            function applyPreviewContentEdit(nodeIndex, innerHTML) {
                if (!presentationDoc || !Number.isInteger(nodeIndex)) return;
                const range = htmlContentRangeForElementIndex(contentEditor.value, nodeIndex);
                if (!range || range.start > range.end) return;
                contentEditor.value = contentEditor.value.slice(0, range.start) + innerHTML + contentEditor.value.slice(range.end);
                const currentSlide = slideElements[currentSlideIndex];
                applyEditorValuesToSlide(currentSlide);
                updateHighlights();
                setDirty(true);
                scheduleSlideOverviewRefresh();
            }

            function showSelectedElementInPreview() {
                if (!previewEditingEnabled || !presentationDoc || document.activeElement !== contentEditor) return;
                const nodeIndex = selectedHtmlElementIndex(contentEditor.value, contentEditor.selectionStart);
                previewFrame.contentWindow?.postMessage({ type: 'editor-selection', nodeIndex }, '*');

            function updatePreviewEditingButton() {
                togglePreviewEditingButton.textContent = previewEditingEnabled

            function setPreviewEditingEnabled(enabled, { persist = true, refresh = true } = {}) {

            function updateEditorVisibility() {
                contentEditorBox.classList.toggle('is-hidden', !contentEditorVisible);
                notesEditorBox.classList.toggle('is-hidden', !notesEditorVisible);
                const anyEditorVisible = contentEditorVisible || notesEditorVisible;

                toggleContentEditorButton.setAttribute('aria-expanded', String(contentEditorVisible));
                toggleNotesEditorButton.textContent = notesEditorVisible ? 'Hide Speaker Notes' : 'Show Speaker Notes';
                toggleNotesEditorButton.setAttribute('aria-expanded', String(notesEditorVisible));

            function toggleEditors() {

                notesEditorVisible = showAll;

            function setEditorPanelRatio(ratio, { persist = true } = {}) {
                editorPanelRatio = Math.min(0.55, Math.max(0.20, Number(ratio) || 0.30));
                mainContainer.style.setProperty('--editor-panel-width', `${(editorPanelRatio * 100).toFixed(2)}%`);
                editorPreviewDivider.setAttribute('aria-valuenow', String(Math.round(editorPanelRatio * 100)));
                if (persist) {
                    try {
                        localStorage.setItem('reveal-editor-panel-ratio', String(editorPanelRatio));
                    } catch (error) {
                        // Storage is optional, especially when the editor is opened as a local file.
                    }
                }
            }

            function resizeEditorPanelFromPointer(clientX) {
                const bounds = mainContainer.getBoundingClientRect();
                if (!bounds.width) return;
                setEditorPanelRatio((clientX - bounds.left) / bounds.width);
            }

            function finishEditorDividerDrag() {
                if (!isEditorDividerDragging) return;
                isEditorDividerDragging = false;

            editorPreviewDivider.addEventListener('pointerdown', (event) => {

            function updateSlideOverviewVisibility() {

                toggleSlideOverviewButton.setAttribute('aria-expanded', String(slideOverviewVisible));

            function updateSlideOverviewSelection() {

            function slideOverviewTitle(slide, index) {
                const heading = slide.querySelector('h1, h2, h3, h4, h5, h6');
                const title = heading?.textContent.replace(/\s+/g, ' ').trim();

            function renderSlideOverview() {
                if (!slideOverviewVisible) return;
                slideOverviewList.replaceChildren();

                if (!presentationDoc || slideElements.length === 0) {
                    const emptyMessage = document.createElement('p');
                    emptyMessage.className = 'slide-overview-empty';

                    slideOverviewList.appendChild(emptyMessage);

                slideElements.forEach((slide, index) => {
                    const thumbnail = document.createElement('div');

                    thumbnail.draggable = true;
                    thumbnail.tabIndex = 0;

                    thumbnail.setAttribute('aria-label', `Slide ${index + 1}: ${slideOverviewTitle(slide, index)}`);

                    const header = document.createElement('div');
                    header.className = 'slide-thumbnail-header';

                    const title = document.createElement('span');
                    title.className = 'slide-thumbnail-title';
                    title.textContent = `${index + 1}. ${slideOverviewTitle(slide, index)}`;
                    header.appendChild(title);

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'slide-thumbnail-delete';
                    deleteButton.type = 'button';
                    deleteButton.title = `Delete slide ${index + 1}`;
                    deleteButton.setAttribute('aria-label', `Delete slide ${index + 1}`);
                    deleteButton.textContent = '×';
                    deleteButton.addEventListener('click', (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        deleteSlide(index);
                    });
                    header.appendChild(deleteButton);
                    thumbnail.appendChild(header);

                    const frame = document.createElement('iframe');
                    frame.className = 'slide-thumbnail-frame';
                    frame.title = `Preview of slide ${index + 1}`;
                    frame.tabIndex = -1;
                    frame.setAttribute('sandbox', 'allow-scripts');
                    thumbnail.appendChild(frame);
                    slideOverviewList.appendChild(thumbnail);
                    const thumbnailScale = Math.min(0.32, Math.max(0.18, frame.clientWidth / 960));
                    frame.srcdoc = buildThumbnailDoc(slide, thumbnailScale);

                    thumbnail.addEventListener('click', () => renderSlide(index));
                    thumbnail.addEventListener('keydown', (event) => {
                        if (event.key !== 'Enter' && event.key !== ' ') return;
                        event.preventDefault();
                        renderSlide(index);
                    });
                    thumbnail.addEventListener('dragstart', (event) => {
                        draggedSlideIndex = index;
                        event.dataTransfer.effectAllowed = 'move';
                        event.dataTransfer.setData('text/plain', String(index));
                    });
                    thumbnail.addEventListener('dragover', (event) => {
                        if (draggedSlideIndex === null) return;
                        event.preventDefault();
                        thumbnail.classList.add('is-drag-over');
                    });
                    thumbnail.addEventListener('dragleave', () => thumbnail.classList.remove('is-drag-over'));
                    thumbnail.addEventListener('drop', (event) => {
                        event.preventDefault();
                        const fromIndex = Number(event.dataTransfer.getData('text/plain'));
                        const sourceIndex = Number.isInteger(fromIndex) ? fromIndex : draggedSlideIndex;
                        thumbnail.classList.remove('is-drag-over');
                        moveSlide(sourceIndex, index);
                    });
                    thumbnail.addEventListener('dragend', () => {
                        draggedSlideIndex = null;
                        slideOverviewList.querySelectorAll('.slide-thumbnail').forEach((item) => item.classList.remove('is-drag-over'));
                    });

                });

                undoDeleteSlideButton.disabled = !lastDeletedSlide;
                updateSlideOverviewSelection();
            }

            function scheduleSlideOverviewRefresh() {
                if (!slideOverviewVisible) return;
                clearTimeout(slideOverviewRenderTimer);
                slideOverviewRenderTimer = setTimeout(renderSlideOverview, 300);
            }

            function moveSlide(fromIndex, toIndex) {
                if (!presentationDoc || fromIndex === toIndex || fromIndex < 0 || toIndex < 0 || fromIndex >= slideElements.length || toIndex >= slideElements.length) return;

                const movedSlide = slideElements[fromIndex];
                const targetSlide = slideElements[toIndex];
                if (!movedSlide || !targetSlide || !targetSlide.parentNode) return;

                if (fromIndex < toIndex) targetSlide.parentNode.insertBefore(movedSlide, targetSlide.nextSibling);
                else targetSlide.parentNode.insertBefore(movedSlide, targetSlide);

                slideElements.splice(fromIndex, 1);
                slideElements.splice(toIndex, 0, movedSlide);

                if (currentSlideIndex === fromIndex) currentSlideIndex = toIndex;
                else if (fromIndex < currentSlideIndex && toIndex >= currentSlideIndex) currentSlideIndex -= 1;
                else if (fromIndex > currentSlideIndex && toIndex <= currentSlideIndex) currentSlideIndex += 1;

                setDirty(true);
                renderSlide(currentSlideIndex);
                renderSlideOverview();
            }

            function deleteSlide(index) {
                if (!presentationDoc || index < 0 || index >= slideElements.length) return;
                if (slideElements.length === 1) {
                    setPreviewStatus('A presentation must contain at least one slide.', 'warning');
                    return;
                }
                if (!window.confirm(`Delete slide ${index + 1}? You can undo this from the slide overview.`)) return;

                const slide = slideElements[index];
                const parent = slide.parentNode;
                const nextSibling = slide.nextSibling;
                lastDeletedSlide = {
                    slide,
                    parent,
                    nextSibling,
                    originalIndex: index,
                    previousCurrentIndex: currentSlideIndex,
                };
                slide.remove();
                slideElements.splice(index, 1);

                if (currentSlideIndex === index) currentSlideIndex = Math.min(index, slideElements.length - 1);
                else if (currentSlideIndex > index) currentSlideIndex -= 1;

                setDirty(true);
                renderSlide(currentSlideIndex);
                renderSlideOverview();
                setPreviewStatus('Slide deleted. Use Undo to restore it.');
            }

            function undoDeleteSlide() {
                if (!lastDeletedSlide || !lastDeletedSlide.parent) return;
                const { slide, parent, nextSibling, originalIndex, previousCurrentIndex } = lastDeletedSlide;
                parent.insertBefore(slide, nextSibling && nextSibling.parentNode === parent ? nextSibling : null);
                slideElements.splice(Math.min(originalIndex, slideElements.length), 0, slide);
                currentSlideIndex = Math.min(previousCurrentIndex, slideElements.length - 1);
                lastDeletedSlide = null;
                setDirty(true);
                renderSlide(currentSlideIndex);
                renderSlideOverview();
                setPreviewStatus('Deleted slide restored.');
            }

            function setPreviewStatus(message, type = '') {
                previewStatus.textContent = message;
                previewStatus.className = type ? `is-${type}` : '';

            function setDirty(dirty) {
                isDirty = dirty;
